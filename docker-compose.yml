services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUN_IMAGE: ${BUN_IMAGE:-oven/bun:1.4.2-debian}
    image: todo:${APP_TAG:-dev}
    container_name: todo
    init: true
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_PATH: /app/data/todo.db
      # Server-only LLM configuration for the embedded AI edge. Compose reads
      # these from .env and forwards them into the container; the manual todo UI
      # keeps working when they are empty. LLM_BASE_URL must include /v1.
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      # Server-only Langfuse tracing. Empty keys disable tracing while the app
      # keeps running. The app container must be able to resolve
      # LANGFUSE_BASE_URL (for example, join the Langfuse compose network).
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-}
      LANGFUSE_TRACING_ENVIRONMENT: ${LANGFUSE_TRACING_ENVIRONMENT:-}
      LANGFUSE_RELEASE: ${LANGFUSE_RELEASE:-}
      LANGFUSE_REALTIME: ${LANGFUSE_REALTIME:-}
      LANGFUSE_FLUSH_AT: ${LANGFUSE_FLUSH_AT:-}
      LANGFUSE_FLUSH_INTERVAL: ${LANGFUSE_FLUSH_INTERVAL:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-todo-ai}
    # Todos live in a SQLite file on a named volume, so they survive image
    # rebuilds and container re-creation.
    volumes:
      - todo-data:/app/data
    # No host port mapping: reach it via Portainer, an attached proxy network,
    # or `docker exec`. Uncomment to publish on the host instead.
    # ports:
    #   - "3000:3000"
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

volumes:
  # SQLite is a single-writer engine: keep this service at one replica and do
  # not place the volume on a network filesystem. Scale out by moving to a
  # client/server database instead.
  todo-data:
